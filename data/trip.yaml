notes:
  - Viagem familiar de 29/12/2026 a 28/01/2027. Seis voos de ida e volta confirmados para os quatro
    viajantes.
  - 'Roteiro-base proposto na China: Beijing 31/12–05/01, Chengdu 05–08/01, Chongqing 08–11/01,
    Zhangjiajie 11–14/01 e Shanghai 14–18/01.'
  - Chegada à China por Beijing Daxing (PKX) em 31/12. Saída do Japão por Tokyo Narita (NRT) em
    27/01. Haneda (HND) permanece a chegada prevista em 18/01, vindo de Shanghai.
  - 'Beijing: Pan Pacific Beijing reservado de 31/12/2026 a 05/01/2027, 5 noites. Check-in a partir
    das 15:00; checkout até as 12:00 (horários locais).'
  - Na volta, conexão em Doha de 45 minutos e em Guarulhos de 1h45, com troca do terminal 3 para o
    2. Confirmar com as companhias as orientações de conexão.
  - 'Tokyo: Ueno Woo Hotel reservado para a noite de 18/01, dois quartos Double Room para os quatro
    viajantes. Check-in de 15:00 a 21:00; checkout até 11:00 de 19/01, horários locais.'
  - Passeios, horários sugeridos e deslocamentos chineses sem reserva são propostas, com status
    Planejado ou Opcional. Hotel de Chongqing ainda a escolher; Wyndham Wulingyuan confirmado em
    Zhangjiajie. Hospedagens japonesas confirmadas em Echigo-Yuzawa de 19 a 21/01 e Fujikawaguchiko
    de 21 a 23/01. Passeios e transportes desse trecho ainda não definidos.
  - Novotel Shanghai Atlantis confirmado de 14 a 18/01/2027, quatro noites em Junior Suite com vista
    para o rio Huangpu. Happy hour para duas pessoas no restaurante giratório, 17:30–20:00, conforme
    opção reservada.
  - 'Xi’an retirado do itinerário. Voo Beijing → Chengdu confirmado para 05/01/2027: Sichuan
    Airlines 3U8894, PEK T2 11:40 → CTU T1 14:40, horários locais.'
  - 'Chengdu: Kaiman Top Floor High Altitude Hotel (Taikoo Li Branch) confirmado de 05 a 08/01/2027,
    três noites.'
  - 'Zhangjiajie: Wyndham ZhangJiajie Wulingyuan Hotel confirmado de 11 a 14/01, três noites em dois
    quartos, com café da manhã para quatro. Tianmen e 72 Qilou planejados em 11/01;
    Yuanjiajie/Tianzi em 12/01; Glass Bridge/Grand Canyon e trecho opcional de Golden Whip Stream em
    13/01.'
  - 'Japão: Purpose Resort Echigo-Yuzawa Kura confirmado de 19 a 21/01 e Hotel Regina Kawaguchiko de
    21 a 23/01, duas noites em cada. Retorno a Tokyo em 23/01; dias 23 e 24 já programados, sem
    detalhes fornecidos. Hotel Monterey Hanzomon confirmado de 23 a 27/01, quatro noites em dois
    quartos, com café da manhã para quatro.'
