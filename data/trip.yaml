usefulInfo:
  - title: Antes de sair do hotel
    body: Confira o próximo endereço local, a estação exata e a antecedência de saída. Guarde uma
      captura da tela de endereço.
  - title: Se um mapa não abrir
    body: Volte à PWA e mostre o nome e o endereço no idioma local. Os mapas são externos e podem
      precisar de internet ou de um aplicativo instalado.
  - title: Emergência e ajuda presencial
    body: Peça ajuda à recepção do hotel, à equipe da estação ou às autoridades locais. Confirme
      contatos públicos oficiais antes da viagem e mantenha contatos privados no Apple Notes.
  - title: Documentos privados
    body:
      Passaportes, vouchers, ingressos, contatos pessoais e reservas ficam no Apple Notes ou iCloud
      Drive, disponíveis offline. Nunca publique códigos de reserva no repositório.
